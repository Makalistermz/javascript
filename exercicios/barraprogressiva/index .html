<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Progressiva</title>
    <style>
        @keyframes crescer {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        h1 {
            text-align: center;
            font-size: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-ativa {
            width: 100%;
            height: 50px;
            margin: 20px 0px;
            border: 2px solid black;
            border-radius: 30px;
        }

        .ativa {
            height: 100%;
            background-color: #9a2cf3;
            border-radius: 30px;
            animation: crescer 3s forwards;
        }

        .container-btn {
            display: flex;
            justify-content: center;
        }

        .btn {
            position: relative;
            width: 350px;
            height:50px;
            background-color:  #9a2cf3;
            border: 2px solid purple;
            border-radius: 20px;
            font-size: 1.3em;
            cursor: pointer;
            color: white;
            overflow: hidden;
            z-index: 0;
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(#9a2cf3, transparent, #9a2cf3);
            animation: girar 2s linear infinite;
            z-index: -1;
        }

        .btn:hover {
            box-shadow: 0px 0px 10px 3px rgba(137, 0, 196, 0.671);
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

    </style>
</head>
<body>
    <h1>Barra progressiva</h1>

    <div class="container-ativa">
        <div id="barra"></div>
    </div>

    <div class="container-btn">
        <button onclick="ativar()" class="btn"><span>Avançar</span></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
