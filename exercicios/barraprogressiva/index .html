<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Progressiva</title>
    <style>
        @keyframes crescer {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes bordaanimada {
            0% {
                border-color: purple;
                border-left-width: 0px;
                border-right-width: 0px;
            }
            50% {
                border-color: #9a2cf3;
                border-left-width: 4px;
                border-right-width: 4px;
            }
            100% {
                border-color: rgb(114, 43, 180);
                border-left-width: 8px;
                border-right-width: 8px;
            }
        }

        h1 {
            text-align: center;
            font-size: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .conatiner-ativa {
            width: 100%;
            height: 50px;
            margin: 20px 0px;
            border: 2px solid black;
            border-radius: 30px;
        }

        .ativa {
            animation: crescer 3s forwards;
        }

        .container-btn {
            display: flex;
            justify-content: center;
        }

        .btn {
            width: 350px;
            height:50px;
            background-color:  #9a2cf3;
            border: none;
            border-radius: 20px;
            font-size: 1.3em;
            cursor: pointer;
            color: white;

            animation: bordaanimada 4s ease-in-out infinite alternate;
        }

        .btn:hover {
            box-shadow: 0px 0px 10px 3px rgba(137, 0, 196, 0.671);
        }

    </style>
</head>
<body>
    <h1>Barra progressiva</h1>

    <div class="conatiner-ativa">
        <div class="ativa"></div>
    </div>

    <div class="container-btn">
        <button onclick="ativar()" class="btn">Avançar</button>
    </div>
</body>
</html>
